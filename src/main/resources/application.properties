spring.application.name=banking

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/banking_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configurations (Secret must be at least 256 bits, base64 or long string)
app.jwt.secret=9a4f2c8d3b7a1e5f8c6d4e2b0a1f3e5d7c9b0a2f4e6d8c0b2a4f6e8d0c2b4a6f
app.jwt.expiration-ms=86400000

# File Upload configurations (optional, in case profiles need images)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Server Port
server.port=8080
