<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASHA BANK - Customer Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js"></script>
</head>
<body>
    <div class="auth-wrapper">
        <div class="glass-card auth-card">
            <div class="auth-header">
                <div class="logo-section" style="justify-content: center; margin-bottom: 0.5rem;">
                    <span class="logo-masha">MASHA</span><span class="logo-bank">BANK</span>
                </div>
                <h2>Welcome Back</h2>
                <p style="color: var(--color-text-secondary); font-size: 0.9rem;">Access your personal banking account securely</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@domain.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    Secure Sign In
                </button>
            </form>

            <div class="auth-footer">
                <p>New to MASHA BANK? <a href="register.html">Create an Account</a></p>
                <p style="margin-top: 0.8rem; font-size: 0.8rem;">
                    Are you an administrator? <a href="admin-login.html" style="color: var(--color-info);">Admin Portal</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Redirect if already logged in
        if (getAuthToken() && getAuthUser()) {
            const user = getAuthUser();
            window.location.href = user.role === 'ROLE_ADMIN' ? 'admin-dashboard.html' : 'dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Authenticating...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    setAuth(data.token, data.email, data.fullName, data.role);
                    showToast('Successfully authenticated. Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = data.role === 'ROLE_ADMIN' ? 'admin-dashboard.html' : 'dashboard.html';
                    }, 1000);
                } else {
                    showToast(data.message || 'Authentication failed. Please check credentials.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Secure Sign In';
                }
            } catch (err) {
                console.error(err);
                showToast('Unable to reach server. Please try again later.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Secure Sign In';
            }
        });
    </script>
</body>
</html>
